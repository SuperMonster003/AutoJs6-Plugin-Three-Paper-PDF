name: Emulator tests

# Roadmap P0.3: the smoke instrumentation tests (activation, discovery and Binder contract, request and answer Bundles,
# the committed samples through PDFBox-Android and PdfRenderer) run on an API 33 emulator. The AVD recipe matches the
# local AVD_API_33 (google_apis x86_64, pixel_6, 4096 MB RAM, swiftshader, no window) except for two cores on the
# four-vCPU runner; roadmap P2 adds the engine cases. No host is installed here, so the Explorer action test expects the
# permission refusal.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connected-avd:
    name: Instrumentation tests (API ${{ matrix.api-level }}, ${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 33
            arch: x86_64
            target: google_apis
            profile: pixel_6

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the debug and test APKs before the emulator starts
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -Pautojs.gradle.build.number.auto.increment.enabled=false -Pautojs.gradle.build.time.update.enabled=false --console=plain --stacktrace

      - name: Run the instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          cores: 2
          ram-size: 4096M
          avd-name: Three_Paper_PDF_CI_${{ matrix.api-level }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          # The emulator runner executes every script line as a separate shell command, so a backslash continuation would
          # become a literal Gradle task name; keep each command on one line (3-Block Compose lesson). The settings lines
          # keep the screen on and suppress crash dialogs for the viewer tests of P2.4 / P3 (3-Maple Image recipe).
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb shell svc power stayon true
            adb shell settings put system screen_off_timeout 2147483647
            adb shell wm dismiss-keyguard
            ./gradlew :app:connectedDebugAndroidTest -Pautojs.gradle.build.number.auto.increment.enabled=false -Pautojs.gradle.build.time.update.enabled=false --console=plain --stacktrace

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-reports-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 7
